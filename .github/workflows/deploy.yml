name: Pipeline de CI/CD - Java & Pages

# O pipeline sera acionado toda vez que houver alteracao (push) na branch principal
on:
  push:
    branches: ["main", "master"]

# Permissoes necessarias para que o pipeline possa publicar no GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obter Copia do Codigo Fonte (Checkout)
        uses: actions/checkout@v4

      - name: 2. Instalar e Configurar o JDK Java (Ambiente de Compilacao)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Compilar e Executar a Aplicacao (Fase de Build)
        run: |
          # O compilador Java (javac) verifica se nao ha erros de sintaxe
          javac src/BuildReporter.java
          # A execucao gera o arquivo final index.html que sera publicado
          java src.BuildReporter

      - name: 4. Publicar Artefato no GitHub Pages (Fase de Deploy)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
